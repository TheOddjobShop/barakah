<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- The journey the app's accent makes across a day: night indigo at the
         top, the gold of Asr through the middle, sunset at the base. -->
    <linearGradient id="sky" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0%"   stop-color="#1d2147"/>
      <stop offset="46%"  stop-color="#383d6e"/>
      <stop offset="78%"  stop-color="#7a5769"/>
      <stop offset="100%" stop-color="#c47c52"/>
    </linearGradient>

    <linearGradient id="moon" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
      <stop offset="0%"   stop-color="#fdf7ea"/>
      <stop offset="100%" stop-color="#f0d5a0"/>
    </linearGradient>

    <!-- Carved from one disc by a second, offset disc, so the inner edge is a
         true circular arc rather than an approximated curve. -->
    <mask id="crescent">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="452" cy="432" r="196" fill="white"/>
      <circle cx="542" cy="388" r="176" fill="black"/>
    </mask>

    <!-- Brightest where the sun would be highest, fading at both horizons -->
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f7e2b8" stop-opacity="0.04"/>
      <stop offset="50%"  stop-color="#f7e2b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f7e2b8" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle, inset to leave the room the system expects for its shadow -->
  <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#sky)"/>

  <g mask="url(#crescent)">
    <rect x="92" y="92" width="840" height="840" fill="url(#moon)"/>
  </g>

  <!-- A single star in the crescent's opening, where the eye already rests -->
  <path d="M 646.0 415.0 L 658.2 445.3 L 690.7 447.5 L 665.7 468.4 L 673.6 500.0 L 646.0 482.7 L 618.4 500.0 L 626.3 468.4 L 601.3 447.5 L 633.8 445.3 Z"
        fill="#f9ead0"/>

  <!-- The sun's arc across the day — the same curve the countdown ring draws,
       kept low so it reads as the horizon the prayers are measured against -->
  <path d="M 216 812 A 532 532 0 0 1 808 812"
        fill="none" stroke="url(#arc)" stroke-width="17" stroke-linecap="round"/>
</svg>
